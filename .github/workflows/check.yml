name: check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # These jobs stay required on main, so a docs change runs them too and they pass without doing anything.
      - id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: sh scripts/ci-scope.sh >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.scope != 'docs'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: steps.scope.outputs.scope != 'docs'
        run: npm ci
      - if: steps.scope.outputs.scope != 'docs'
        run: npm run format:check
      - if: steps.scope.outputs.scope != 'docs'
        run: npm run typecheck
      - if: steps.scope.outputs.scope == 'normal'
        run: npm run test:quick
      - if: steps.scope.outputs.scope == 'full'
        run: npm test
      - if: steps.scope.outputs.scope != 'docs'
        run: sh scripts/install-smoke.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: sh scripts/ci-scope.sh >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.scope != 'docs'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: steps.scope.outputs.scope != 'docs'
        run: npm ci
      - if: steps.scope.outputs.scope != 'docs'
        run: npm run format:check
      - if: steps.scope.outputs.scope != 'docs'
        run: npm run typecheck
      - if: steps.scope.outputs.scope == 'normal'
        run: npm run test:quick
      - if: steps.scope.outputs.scope == 'full'
        run: npm test
